<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a2b">
<meta name="description" content="FunghiAlpini — strumento offline di primo riconoscimento funghi per escursioni in montagna.">
<title>FunghiAlpini</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Barra superiore: nome app + stato connessione -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo" aria-hidden="true">🍄</span>
      <span class="topbar-title">FunghiAlpini</span>
    </div>
    <div id="conn-indicator" class="conn-indicator conn-offline" role="status" aria-live="polite">
      <span class="conn-dot" aria-hidden="true"></span>
      <span class="conn-label">...</span>
    </div>
  </header>

  <!-- Contenuto della vista corrente, riempito da js/router.js -->
  <main id="view-root" tabindex="-1"></main>

  <!-- Navigazione principale, sempre raggiungibile col pollice -->
  <nav class="bottom-nav" aria-label="Navigazione principale">
    <a href="#/catalogo" class="nav-btn" data-route="catalogo">
      <span class="nav-icon" aria-hidden="true">📖</span><span>Catalogo</span>
    </a>
    <a href="#/guidato" class="nav-btn" data-route="guidato">
      <span class="nav-icon" aria-hidden="true">🔍</span><span>Riconosci</span>
    </a>
    <a href="#/diario" class="nav-btn" data-route="diario">
      <span class="nav-icon" aria-hidden="true">📷</span><span>Diario</span>
    </a>
    <a href="#/ai" class="nav-btn" data-route="ai">
      <span class="nav-icon" aria-hidden="true">✨</span><span>Assistente</span>
    </a>
    <a href="#/info" class="nav-btn" data-route="info">
      <span class="nav-icon" aria-hidden="true">ℹ️</span><span>Info</span>
    </a>
  </nav>

</div>

<!-- Toast di sistema (salvataggi, errori, avvisi) -->
<div id="toast" class="toast" role="alert" aria-live="assertive"></div>

<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/guided.js"></script>
<script src="js/camera.js"></script>
<script src="js/ai.js"></script>
<script src="js/views.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
