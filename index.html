<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a2b">
<meta name="description" content="FunghiAlpini — riconosci un fungo da una foto durante le tue escursioni in montagna.">
<title>FunghiAlpini</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Barra superiore: nome app + stato connessione + accesso rapido a impostazioni/info -->
  <header class="topbar">
    <a href="#/riconosci" class="topbar-brand">
      <span class="topbar-logo" aria-hidden="true">🍄</span>
      <span class="topbar-title">FunghiAlpini</span>
    </a>
    <div class="topbar-actions">
      <div id="conn-indicator" class="conn-indicator conn-offline" role="status" aria-live="polite">
        <span class="conn-dot" aria-hidden="true"></span>
        <span class="conn-label">...</span>
      </div>
      <a href="#/impostazioni" class="icon-btn" aria-label="Impostazioni">⚙️</a>
      <a href="#/info" class="icon-btn" aria-label="Info">ℹ️</a>
    </div>
  </header>

  <!-- Contenuto della vista corrente, riempito da js/router.js -->
  <main id="view-root" tabindex="-1"></main>

</div>

<!-- Toast di sistema (errori, avvisi) -->
<div id="toast" class="toast" role="alert" aria-live="assertive"></div>

<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/views.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
